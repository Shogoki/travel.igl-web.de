baseURL = 'https://travel.igl-web.de/'
# German site. locale drives <html lang> and Hugo's own date formatting
# (time.Format ":date_full" → "Mittwoch, 3. Juli 2024"); it replaces the
# deprecated languageCode.
defaultContentLanguage = 'de'
locale = 'de-DE'
title = 'Crocs around the world'
theme = "hugo-theme-cleanwhite"

[taxonomies]
  category = "categories"
  tag = "tags"
  country = "countries"

[outputs]
home = ["HTML", "RSS"]

[params]
  # To build against a local API, override this in an untracked
  # config.local.toml (see CLAUDE.md) instead of editing it here.
  icloud_api="https://icloud-api.evolution-web.de"
  header_image = "img/home-bg-jeep.jpg"
  SEOTitle = "Igl Travel - Crocs around the world"
  # Used for the homepage's search snippet and link preview; posts use the
  # start of their own text instead.
  description = "Reiseblog von Kerstin und Sven: Geschichten und Fotos von unseren Reisen durch Südamerika, Asien, Australien und mehr."

  # The theme's own 404-bg.jpg was never added, so the 404 page's header
  # image was itself a 404.
  image_404 = "img/home-bg-jeep.jpg"
  title_404 = "Seite nicht gefunden"
  omit_categories = true

  custom_css = ["css/custom-nav.css", "css/gallery.css", "css/footer.css", "css/post-list.css", "css/header.css"]

  # Footer icons exist for: email, twitter, instagram, facebook, mastodon,
  # github, rss (see layouts/partials/footer.html).
  [params.social]
  rss            = true
  email          = "travel@igl-web.de"
  twitter        = "https://twitter.com/theshogoki"
  #instagram     = "https://www.instagram.com/roaminginrubber/"
  github         = "https://github.com/Shogoki"

  [[params.addtional_menus]]
  title =  "Unsere Route"
  href =  "/unsere-route/"

[markup]
  [markup.tableOfContents]
    endLevel = 2
    startLevel = 1
  [markup.highlight]
    style = "dracula"

  [params.giscus]
    data_repo="Shogoki/travel.igl-web.de"
    data_repo_id="R_kgDOIJDC8A"
    data_category_id="DIC_kwDOIJDC8M4CR0fv"
    data_mapping="pathname"
    data_strict="0"
    data_reactions_enabled="1"
    data_emit_metadata="0"
    data_input_position="top"
    data_theme="light"
    data_lang="de"
    crossorigin="anonymous"

# Hugo keeps remotely fetched resources forever by default, so a local build
# never noticed photos added to an existing album. CI starts with an empty
# cache and always fetches fresh; this only changes local builds.
[caches.getresource]
  maxAge = "1h"
